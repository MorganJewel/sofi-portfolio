        .scrapbook-cluster {

        @keyframes stopmotion-in {
            from {

            to {
                opacity: 1;
                transform: translate(0, 0) rotate(var(--base-rotate, 0deg)) scale(1);
            }
        }

        .stop-in {
            animation-name: stopmotion-in;
            animation-duration: 0.9s;
            animation-timing-function: steps(6, end);
            animation-fill-mode: forwards;

    <!-- VANILLA JAVASCRIPT FOR INFINITE CANVAS MOVE -->
    <script>
        let currentX = -500;
        let currentY = -1000;
        let currentScale = 1.4;
        let isDragging = false;
        let isZoomed = false;
        let startX, startY;

        const mainContent = document.getElementById('main-content');

        document.querySelectorAll('.stop-in').forEach((el) => {
            el.addEventListener('animationend', () => {
                el.style.animation = 'none';
            }, { once: true });
        });

        function applyTransform(x, y, scale, animate) {
            mainContent.style.transition = animate ? 'transform 0.6s ease' : 'none';
            mainContent.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
            document.body.style.backgroundPosition = `calc(50% + ${x}px) calc(50% + ${y}px)`;
        }

        applyTransform(currentX, currentY, currentScale, false); // set starting position

        window.addEventListener('mousedown', (e) => {
            if (isZoomed) return; // don't drag while zoomed into something
            isDragging = true;
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            applyTransform(currentX, currentY, currentScale, false);
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mouseleave', () => { isDragging = false; });

        // --- Camera zoom toward a specific element ---
        function zoomToElement(el, zoomScale = 2.5) {
            const rect = mainContent.getBoundingClientRect();
            const baseX = rect.left - currentX;
            const baseY = rect.top - currentY;

            const cx = el.offsetLeft + el.offsetWidth / 2;
            const cy = el.offsetTop + el.offsetHeight / 2;

            const targetX = window.innerWidth / 2 - baseX - zoomScale * cx;
            const targetY = window.innerHeight / 2 - baseY - zoomScale * cy;

            isZoomed = true;
            applyTransform(targetX, targetY, zoomScale, true);
        }

        function zoomOut() {
            isZoomed = false;
            applyTransform(currentX, currentY, currentScale, true);
        }

        ['snoopy-polaroid', 'polaroids', 'cat'].forEach((id) => {
            const el = document.getElementById(id);
            el.addEventListener('mouseenter', () => zoomToElement(el, 2.5));
            el.addEventListener('mouseleave', zoomOut);
        });
    </script>
